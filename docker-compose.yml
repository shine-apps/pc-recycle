# 桐乡阳光回收网站 — 容器编排（web + postgres）
# 前置：在项目根目录创建 .env（不会被提交，见 .gitignore），至少设置：
#   AUTH_SECRET=一段足够长的随机字符串（openssl rand -base64 32）
#   ADMIN_PASSWORD=你的强密码
# 然后执行：docker compose up -d
# 访问 http://localhost:4444 ；后台 /admin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pc
      POSTGRES_PASSWORD: pcpass
      POSTGRES_DB: pcrecycle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc -d pcrecycle"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 容器网络内通过服务名 postgres 访问
      DATABASE_URL: postgres://pc:pcpass@postgres:5432/pcrecycle
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "4444"
    volumes:
      # 上传图片需持久化，避免容器重建后丢失
      - uploads:/app/public/uploads
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4444 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  uploads:
