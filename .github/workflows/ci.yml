name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由仓库 package.json 的 packageManager 字段自动确定

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # 内存版 PGlite：构建期无需外部数据库，零磁盘依赖
          DATABASE_URL: pglite://memory
          AUTH_SECRET: ci-test-secret-please-change
          NEXT_TELEMETRY_DISABLED: 1

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: pglite://memory
          NEXT_TELEMETRY_DISABLED: 1
